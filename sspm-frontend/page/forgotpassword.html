<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sutera Secure Password Manager</title>
    <link rel="stylesheet" href="../style/forgotPassword.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <link rel="icon" href="../images/sspmlogo.png" type="image/png">
</head>

<body>

    <!-- Header Section -->
    <header>
        <div class="container">
            <nav>
                <h1 class="logo">Sutera<span>Secure</span></h1>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="container">
        <h2>Forgotten Password</h2>
        <form id="forgotPasswordForm">
            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" required>
            <button type="button" id="checkEmailButton">Submit</button>

            <div id="verifySection" style="display: none; margin-top: 20px;">
                <p>Your account is active.</p>
                <button type="button" id="verifyButton" class="btn-gradient">Send Code</button>
                <input type="text" id="verificationCode" placeholder="Enter code">
                <button type="button" id="confirmVerifyButton" class="btn-gradient">Verify Code</button>
            </div>
        </form>
        <div class="message" id="message"></div>
    </div>

    <script type="module" src="../router/resetPassword.js"></script>

    <footer>
        <div class="container">
            <p>&copy; 2025 Sutera Secure. All rights reserved.</p>
        </div>
    </footer>
</body>

</html>
