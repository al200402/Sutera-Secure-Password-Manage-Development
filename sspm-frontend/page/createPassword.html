<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sutera Secure Password Manager</title>
    <link rel="stylesheet" href="../style/createPassword.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <link rel="icon" href="../images/sspmlogo.png" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/zxcvbn/4.4.2/zxcvbn.js"></script>
    <style>

    </style>
</head>

<body>

    <!-- Header Section -->
    <header>
        <div class="container">
            <nav>
                <h1 class="logo">Sutera<span>Secure</span></h1>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="container mt-5">
        <h2>Create Your Password</h2>
        <form id="passwordForm">

            <div class="mb-3 password-wrapper">
                <label for="password" class="form-label">New Password</label>
                <div class="input-container">
                    <input type="password" id="password" class="form-control" required>
                    <img src="../images/eye-close.png" id="togglePasswordIcon" class="toggle-password"
                        onclick="togglePassword('password', 'togglePasswordIcon')" alt="toggle password visibility">
                </div>
            </div>

            <div class="strength-meter">
                <div></div>
            </div>
            <small id="password-strength-text" class="form-text"></small>
            <ul id="password-hints" class="password-hints"></ul>
            <div class="mb-3 password-wrapper">
                <label for="confirmPassword" class="form-label">Confirm Password</label>
                <div class="input-container">
                    <input type="password" id="confirmPassword" class="form-control" required>
                    <img src="../images/eye-close.png" id="toggleConfirmPasswordIcon" class="toggle-password"
                        onclick="togglePassword('confirmPassword', 'toggleConfirmPasswordIcon')"
                        alt="toggle confirm password visibility">
                </div>
                <small id="password-match-text" class="form-text text-danger"></small>
            </div>
            <button type="button" id="setPasswordButton" class="btn btn-primary">Set Password</button>
        </form>
    </div>

    <script src="../router/login.js"></script>
    <script type="module" src="../router/createPassword.js"></script>

    <footer>
        <div class="container">
            <p>&copy; 2025 Sutera Secure. All rights reserved.</p>
        </div>
    </footer>

</body>

</html>
